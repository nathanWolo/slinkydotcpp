[project]
name = "slinky"
version = "0.1.0"
description = "A fast, rules-exact Battlesnake environment in JAX for reinforcement learning research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slinky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: tests that compare against the official Go rules engine (needs Go)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
