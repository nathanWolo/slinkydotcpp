[project]
name = "slinky"
version = "0.1.0"
description = "A fast, rules-exact Battlesnake environment in JAX for reinforcement learning research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    # jaxlib 0.11 on Windows crashes the process (fatal exception 0x80000001) in the
    # networks' convolutions after a few calls; 0.10.2 is stable.
    "jaxlib<0.11; sys_platform == 'win32'",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Reinforcement-learning baselines (baselines/).
rl = [
    "optax>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "optax>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slinky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "oracle: tests that compare against the official Go rules engine (needs Go)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Exploratory analysis scripts kept as a record (docs/research/multimode_constrictor.md).
extend-exclude = ["docs/research/multimode_constrictor_analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
