[package]
name = "slinky-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AWS Lambda (provided.al2023) handler for the native slinky AlphaZero snakes"

[lib]
name = "slinky_lambda"
path = "src/lib.rs"

[[bin]]
name = "slinky-lambda"
path = "src/main.rs"

[dependencies]
lambda_runtime = { version = "1", default-features = false }
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
slinky-api = { path = "../api" }
slinky-rules = { path = "../rules" }
slinky-search = { path = "../search" }
